name: Wallapop daily deals

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 15:00 Spain
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email with current deals (true/false)"
        required: false
        default: "false"

# Allow the job to commit seen.json back to the repo.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deal finder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEND_TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: python wallapop_deals.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json deals.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update deal state [skip ci]"
            git push
          fi
